<style>

@media print{header.top,nav.tabs,.noprint,button{display:none!important}.prog{border:1px solid #999}body{background:#fff;color:#000;font-size:11pt}main{max-width:none;padding:0}.card{break-inside:avoid;border-color:#ccc;box-shadow:none}.thumb{width:150px;height:112px}.unitbar{break-after:avoid}}

<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<script>
// ======== منطق الحساب (نفس منطق التطبيق) ========
function normAr(s){
  s = String(s||'').toLowerCase();
  const ad='٠١٢٣٤٥٦٧٨٩', pd='۰۱۲۳۴۵۶۷۸۹';
  let o='';
  for (const ch of s){
    let c=ch;
    if ('أإآٱ'.includes(c)) c='ا'; else if (c==='ة') c='ه'; else if (c==='ى') c='ي';
    else if (ad.includes(c)) c=String(ad.indexOf(c)); else if (pd.includes(c)) c=String(pd.indexOf(c));
    const k=c.charCodeAt(0);
    if ((k>=0x64B && k<=0x65F) || k===0x670 || k===0x640) continue;
    o+=c;
  }
  return o.trim();
}
function matches(q, ...fields){
  const t = normAr(q).split(/\s+/).filter(Boolean);
  if (!t.length) return true;
  const hay = normAr(fields.filter(x=>x!=null).join(' '));
  return t.every(x=>hay.includes(x));
}
const C = {branches:[],units:[],groups:[],cats:[],controls:[]};
function setCatalog(items){
  C.branches=[];C.units=[];C.groups=[];C.cats=[];C.controls=[];
  const map={branch:C.branches,unit:C.units,group:C.groups,category:C.cats,control:C.controls};
  for (const it of items){ const d=it.data; d.isActive = d.isActive!==false; if (map[it.kind]) map[it.kind].push(d); }
  const so=(a,b)=>(a.sortOrder||0)-(b.sortOrder||0);
  [C.units,C.groups,C.cats,C.controls].forEach(a=>a.sort(so));
  C.branches.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
}
function catalogItems(){
  const out=[]; const add=(kind,arr)=>arr.forEach(d=>out.push({kind,id:d.id,data:d}));
  add('branch',C.branches); add('unit',C.units); add('group',C.groups); add('category',C.cats); add('control',C.controls);
  return out;
}
const byId=(arr,id)=>arr.find(x=>x.id===id);
function unitControls(unitId, activeOnly=true){
  const ids=new Set(C.cats.filter(c=>c.unitId===unitId&&(!activeOnly||c.isActive)).map(c=>c.id));
  return C.controls.filter(k=>ids.has(k.categoryId)&&(!activeOnly||k.isActive));
}
function weightSum(unitId){ return unitControls(unitId).reduce((a,k)=>a+(k.maxScore||0),0); }
function computeUnit(unit, findings){
  const controls=unitControls(unit.id);
  const total={};
  findings.filter(f=>f.unitId===unit.id).forEach(f=>{ total[f.controlId]=(total[f.controlId]||0)+(f.violationCount||0); });
  let planned=0, loss=0;
  controls.forEach(k=>{
    planned+=k.maxScore||0;
    const v=total[k.id]||0;
    // These controls store the selected deduction directly, not a count to multiply by the default penalty.
    const servicePartIds = ["services_admin_i5","services_admin_i6","services_admin_i7","services_admin_i8","services_admin_i9"];
    const directDeduction = ["security_i14","cameras_i11","maintenance_i3",...servicePartIds].includes(k.id);
    const serviceDeduction = servicePartIds.includes(k.id) ? (v===1||v===2 ? v : (v===4||v===8 ? k.maxScore/2 : v===12||v===3 ? k.maxScore : v)) : v;
    if ((k.maxScore||0)>0 && v>0) loss+=Math.min(k.maxScore, directDeduction ? serviceDeduction : v*(k.penaltyPerViolation||1));
  });
  const actual=planned-loss;
  const ids=new Set(controls.map(k=>k.id));
  const violCount=findings.filter(f=>f.unitId===unit.id && f.violationCount>0 && ids.has(f.controlId) && (byId(C.controls,f.controlId).maxScore||0)>0).length;
  return {planned, actual, percent: planned>0? actual/planned*100 : 0, violCount};
}
const avg=a=>a.length? a.reduce((x,y)=>x+y,0)/a.length : null;
function buildReport(r, names){
  const d=r.data||{inspection:{},units:[],findings:[],photos:[]};
  const na=new Set((d.units||[]).filter(u=>u.isNA).map(u=>u.unitId));
  const lines=C.units.filter(u=>u.isActive).map(u=> na.has(u.id)? {unit:u,na:true} : Object.assign({unit:u,na:false}, computeUnit(u,d.findings||[])));
  const photosBy={}; (d.photos||[]).forEach(p=>{ (photosBy[p.findingId]=photosBy[p.findingId]||[]).push(p); });
  const unitOrder=Object.fromEntries(C.units.map((u,i)=>[u.id,i]));
  const viol=[], censusMap={};
  (d.findings||[]).filter(f=>f.violationCount>0 && !na.has(f.unitId)).forEach(f=>{
    const k=byId(C.controls,f.controlId); if(!k) return;
    const cat=byId(C.cats,k.categoryId), u=byId(C.units,f.unitId), g=f.groupId? byId(C.groups,f.groupId):null;
    if ((k.maxScore||0)<=0){
      const key=f.unitId+'|'+k.id;
      const e=censusMap[key]=censusMap[key]||{unitId:f.unitId,unitName:u?u.name:'',categoryName:cat?cat.name:'',controlText:k.text,order:[unitOrder[f.unitId]||0,cat?cat.sortOrder:0,k.sortOrder||0],parts:[]};
      // يدعم أسماء الحقول المتداولة من إصدارات التطبيق المختلفة، سواء كانت مباشرة أو داخل census/pricing.
      const meta=(f.census&&typeof f.census==='object')?f.census:((f.pricing&&typeof f.pricing==='object')?f.pricing:{});
      const firstDefined=(...vals)=>vals.find(v=>v!==undefined&&v!==null&&v!=='');
      const rawQty=firstDefined(f.quantity,f.qty,f.count,f.cnt,f.violationCount,meta.quantity,meta.qty,meta.count);
      const rawPrice=firstDefined(f.unitPrice,f.unit_price,f.pricePerUnit,f.price_per_unit,f.unitCost,f.unit_cost,meta.unitPrice,meta.unit_price,meta.pricePerUnit,meta.price_per_unit);
      const rawTotal=firstDefined(f.total,f.lineTotal,f.line_total,f.amount,meta.total,meta.lineTotal,meta.line_total,meta.amount);
      const qty=Math.max(0,Number(rawQty)||0), price=rawPrice==null?null:Number(rawPrice);
      const total=rawTotal==null?(price==null?null:qty*price):Number(rawTotal);
      e.parts.push({g:g?g.sortOrder||0:0,n:qty,unitPrice:Number.isFinite(price)?price:null,total:Number.isFinite(total)?total:null});
    } else {
      const rawCount=Number(f.violationCount)||0;
      const servicePartIds=["services_admin_i5","services_admin_i6","services_admin_i7","services_admin_i8","services_admin_i9"];
      const directDeduction=["security_i14","cameras_i11","maintenance_i3",...servicePartIds].includes(k.id);
      const serviceDeduction=servicePartIds.includes(k.id) ? (rawCount===1||rawCount===2 ? rawCount : (rawCount===4||rawCount===8 ? (Number(k.maxScore)||0)/2 : rawCount===12||rawCount===3 ? Number(k.maxScore)||0 : rawCount)) : rawCount;
      const deduction=Math.min(Number(k.maxScore)||0, directDeduction ? serviceDeduction : rawCount*(Number(k.penaltyPerViolation)||1));
      const subparts=k.id==="maintenance_i3" ? [2,5].filter(n=>rawCount===7 || rawCount===n) : servicePartIds.includes(k.id) ? ((rawCount===12||rawCount===3) ? (k.id==="services_admin_i5"?["حريمي","رجالي"]:k.id==="services_admin_i6"?["حريمي","رجالي"]:k.id==="services_admin_i7"?["المدخل","المخرج"]:k.id==="services_admin_i8"?["النظافة","الترتيب"]:["المنطقة المحيطة","الواجهات الزجاجية"]) : (rawCount===4||rawCount===1 ? [k.id==="services_admin_i5"||k.id==="services_admin_i6"?"حريمي":k.id==="services_admin_i7"?"المدخل":k.id==="services_admin_i8"?"النظافة":"المنطقة المحيطة"] : rawCount===8||rawCount===2 ? [k.id==="services_admin_i5"||k.id==="services_admin_i6"?"رجالي":k.id==="services_admin_i7"?"المخرج":k.id==="services_admin_i8"?"الترتيب":"الواجهات الزجاجية"] : [])) : [];
      viol.push({finding:f,control:k,category:cat,unit:u,group:g,photos:photosBy[f.id]||[],deduction,subparts});
    }
  });
  viol.sort((a,b)=>(unitOrder[a.unit&&a.unit.id]||0)-(unitOrder[b.unit&&b.unit.id]||0) || (a.category?a.category.sortOrder:0)-(b.category?b.category.sortOrder:0) || (a.control.sortOrder||0)-(b.control.sortOrder||0));
  const census=Object.values(censusMap).sort((a,b)=>a.order[0]-b.order[0]||a.order[1]-b.order[1]||a.order[2]-b.order[2]).map(e=>{ e.parts.sort((x,y)=>x.g-y.g); e.nums=e.parts.map(p=>p.n); e.total=e.nums.reduce((x,y)=>x+y,0); const priced=e.parts.filter(p=>p.unitPrice!=null); e.unitPrice=priced.length===e.parts.length && e.parts.length && e.parts.every(p=>p.unitPrice===e.parts[0].unitPrice)?e.parts[0].unitPrice:null; e.amount=e.parts.every(p=>p.total!=null)?e.parts.reduce((sum,p)=>sum+p.total,0):(e.parts.every(p=>p.unitPrice!=null)?e.parts.reduce((sum,p)=>sum+p.n*p.unitPrice,0):null); e.hasPrice=e.parts.some(p=>p.unitPrice!=null||p.total!=null); e.priceIncomplete=!e.hasPrice || e.parts.some(p=>p.unitPrice==null&&p.total==null); e.expr=e.nums.length>1? '('+e.nums.join('+')+') = '+e.total : String(e.total); return e; });
  const missing=viol.filter(v=>v.control.photoRequired && !v.photos.length).length;
  return {
    r, d, lines, viol, census, missing,
    branch:(byId(C.branches,r.branch_id)||{}).name||'فرع محذوف',
    inspector:(names&&names[r.inspector_id])||'',
    secAvg: avg(lines.filter(l=>!l.na&&l.unit.kind==='SECTION').map(l=>l.percent)),
    admAvg: avg(lines.filter(l=>!l.na&&l.unit.kind==='ADMINISTRATION').map(l=>l.percent))
  };
}
if (typeof module!=='undefined') module.exports={normAr,matches,C,setCatalog,catalogItems,computeUnit,buildReport,weightSum,unitControls};
// ======== ZIP (بدون ضغط) ========
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(); const parts=[]; const cds=[]; let off=0, cdSize=0;
  for(const f of files){
    const name=enc.encode(f.name), crc=crc32(f.data), size=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,size,true);h.setUint32(22,size,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,name,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,size,true);c.setUint32(24,size,true);c.setUint16(28,name.length,true);

    cds.push(c.buffer,name); cdSize+=46+name.length; off+=30+name.length+size;
  }
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);

}

function mediaName(b,v,k,p,used){
  const cl=t=>String(t||'').replace(/[\\/:*?"<>|]/g,'_').trim();
  const base=`${cl(v.unit&&v.unit.name)}/${v.control.sortOrder}`+(v.group?'_'+cl(v.group.name):'')+`_${k+1}`;
  const ext=p.ext||'jpg'; let name=`${base}.${ext}`,n=2; while(used.has(name)){name=`${base}_${n}.${ext}`;n++} used.add(name); return name;
}
async function collectZip(b){
  const files=[],used=new Set();
  for(const v of b.viol){let k=0;for(const p of v.photos){let blob;try{blob=await getMedia(b.r,p)}catch(e){if(e.code===404||e.code===400)continue;throw e}
    files.push({name:mediaName(b,v,k++,p,used),data:new Uint8Array(await blob.arrayBuffer())})}}
  return files;
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
async function doZip(){
  const b=view.b; toast('جاري تجهيز الملف...');
  try{const f=await collectZip(b); if(!f.length){toast('مفيش صور متاحة',true);return} download(makeZip(f),`Raneen_${b.r.report_number}_photos.zip`)}catch(e){toast(errTxt(e),true)}
}
async function doFinal(){
  const b=view.b,r=b.r; const btn=document.querySelector('[data-act=finalApprove]'); if(btn)btn.disabled=true;
  try{
    toast('جاري تنزيل الصور أولًا...');
    const files=await collectZip(b);                         // لازم كل الصور تتنزّل قبل الاعتماد
    if(files.length) download(makeZip(files),`Raneen_${r.report_number}_photos.zip`);
    await review('FINAL_APPROVED');
    for(const v of b.viol) for(const p of v.photos){
      const key=`${r.inspector_id}/${r.id}/${p.id}.${p.ext||'jpg'}`;
      try{await api('/functions/v1/swift-worker',{method:'POST',body:{action:'delete',path:key}})}catch(e){}   // Backblaze
      try{await api(`/storage/v1/object/${CFG.bucket}/${key}`,{method:'DELETE'})}catch(e){}                  // تقارير قديمة على Supabase
    }
    toast('اتعتمد التقرير. احفظ ملف ZIP + اطبع PDF للأرشيف.'); render();
  }catch(e){ el('rerr').textContent=errTxt(e); if(btn)btn.disabled=false }
}
function csvReport(){
  const b=view.b,q=s=>{let v=String(s==null?'':s);if(/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'},rows=[];
  rows.push(['رقم التقرير',b.r.report_number],['الفرع',b.branch],['المراقب',b.inspector],['الحالة',ST[b.r.status]],['متوسط الأقسام',pctTxt(b.secAvg)],['متوسط الإدارات',pctTxt(b.admAvg)],[],['القسم','الدرجة','من','النسبة','المخالفات']);
  b.lines.forEach(l=>rows.push(l.na?[l.unit.name,'N/A']:[l.unit.name,f1(l.actual),f1(l.planned),f1(l.percent),l.violCount]));
  rows.push([],['القسم','الكاتجري','رقم البند','البند','المجموعة','عدد الصور']);
  b.viol.forEach(v=>rows.push([v.unit&&v.unit.name,v.category&&v.category.name,v.control.sortOrder,v.control.text,v.group?v.group.name:'',v.photos.length]));
  if(b.census.length){rows.push([],['ضوابط الحصر'],['القسم','الكاتجري','الضابط','التفاصيل','الكمية','سعر الوحدة','الإجمالي','حالة بيانات السعر']);b.census.forEach(c=>rows.push([c.unitName,c.categoryName,c.controlText,c.nums.join('+'),c.total,c.unitPrice??'',c.amount??'',c.hasPrice?'متاح':'غير متزامن/غير متاح']))}
  download(new Blob(['\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`Raneen_${b.r.report_number}.csv`);
}

// ---------- الرسائل (شات بين المستخدمين) ----------
// نص فقط حاليًا. التسليم بالـ polling (٣ ثواني والشات مفتوح، ٣٠ ثانية في باقي الصفحات). الأمان على السيرفر بـ RLS.
const CH={msgs:[],auto:{},cursor:'1970-01-01T00:00:00Z',q:'',tick:0,busy:false,ens:new Set()};
const CB=new Map(); // مسار المرفق → blob URL (كاش)
function resetChat(){CH.msgs=[];CH.auto={};CH.cursor='1970-01-01T00:00:00Z';CH.q='';CH.ens=new Set();CB.forEach(u=>URL.revokeObjectURL(u));CB.clear()}
const cidOf=(a,b)=>[a,b].sort().join('_');
const pad2=n=>String(n).padStart(2,'0');
const fmtT=ms=>{const d=new Date(ms);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const dkey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const dlabel=ms=>{const k=dkey(ms),n=Date.now();return k===dkey(n)?'اليوم':k===dkey(n-864e5)?'أمس':k};
const listT=ms=>{const k=dkey(ms),n=Date.now();return k===dkey(n)?fmtT(ms):k===dkey(n-864e5)?'أمس':k};
function uuid(){ if(crypto.randomUUID) return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20) }
function addMsg(r){
  const m={id:r.id,cid:r.conversation_id,from:r.sender_id,to:r.receiver_id,type:r.type,body:r.body,path:r.media_path,at:Date.parse(r.created_at),read:r.read_at?Date.parse(r.read_at):null};
  const i=CH.msgs.findIndex(x=>x.id===m.id);
  if(i>=0) CH.msgs[i]=Object.assign(CH.msgs[i],m,{read:m.read||CH.msgs[i].read}); else CH.msgs.push(m);
}
function chatExpire(){const now=Date.now();CH.msgs=CH.msgs.filter(m=>{const h=CH.auto[m.cid];return !h||m.at>=now-h*36e5})}
const peerOf=m=>m.from===ME.id?m.to:m.from;
const pname=id=>NAMES[id]||'مستخدم محذوف';
async function chatSync(){
  if(CH.busy||!ME||!S) return; CH.busy=true;
  try{
    const cv=await api('/rest/v1/chat_conversations?select=id,auto_delete_hours');
    CH.auto={}; cv.forEach(c=>{if(c.auto_delete_hours) CH.auto[c.id]=c.auto_delete_hours});
    for(;;){
      const rows=await api('/rest/v1/chat_messages?select=id,conversation_id,sender_id,receiver_id,type,body,media_path,created_at,read_at&created_at=gt.'+encodeURIComponent(CH.cursor)+'&order=created_at.asc&limit=500');
      rows.forEach(r=>{addMsg(r);CH.cursor=r.created_at});
      if(rows.length<500) break;
    }
    // علامة "اتقرت" على رسايلي (بنسأل بس عن اللي لسه ما اتقراش)
    const ids=CH.msgs.filter(m=>m.from===ME.id&&!m.read).slice(-100).map(m=>m.id);
    if(ids.length){const rr=await api('/rest/v1/chat_messages?select=id,read_at&id=in.('+ids.join(',')+')&read_at=not.is.null');
      rr.forEach(r=>{const m=CH.msgs.find(x=>x.id===r.id);if(m)m.read=Date.parse(r.read_at)})}
    chatExpire();
  }catch(e){ /* فشل مؤقت: المحاولة الجاية */ }
  finally{ CH.busy=false }
  if(view.tab==='chat'&&view.peer) await chatMarkRead();
  chatUI();
}
async function chatMarkRead(){
  const cid=cidOf(ME.id,view.peer), un=CH.msgs.filter(m=>m.cid===cid&&m.to===ME.id&&!m.read);
  if(!un.length) return;
  try{
    await api('/rest/v1/chat_messages?conversation_id=eq.'+cid+'&receiver_id=eq.'+ME.id+'&read_at=is.null',{method:'PATCH',headers:{Prefer:'return=minimal'},body:{read_at:new Date().toISOString()}});
    const t=Date.now(); un.forEach(m=>m.read=t);
  }catch(e){}
}
async function ensureConv(cid){
  if(CH.ens.has(cid)) return;
  const [a,b]=cid.split('_');
  await api('/rest/v1/chat_conversations?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:{id:cid,user_a:a,user_b:b}});
  CH.ens.add(cid);
}
async function sendChat(){
  const inp=el('cin'); if(!inp||!view.peer) return;
  const t=inp.value.trim(); if(!t) return;
  const cid=cidOf(ME.id,view.peer), btn=el('csend'); inp.value=''; btn.disabled=true;
  try{
    await ensureConv(cid);
    const rows=await api('/rest/v1/chat_messages?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=representation'},
      body:{id:uuid(),conversation_id:cid,sender_id:ME.id,receiver_id:view.peer,type:'TEXT',body:t}});
    if(rows&&rows[0]) addMsg(rows[0]);
  }catch(e){ inp.value=t; toast(errTxt(e),true) }
  finally{ btn.disabled=false; chatUI(true); inp.focus() }
}
async function toggleAuto(){
  if(!view.peer) return; const cid=cidOf(ME.id,view.peer), on=!!CH.auto[cid];
  try{
    await ensureConv(cid);
    await api('/rest/v1/chat_conversations?id=eq.'+cid,{method:'PATCH',headers:{Prefer:'return=minimal'},body:{auto_delete_hours:on?null:24}});
    if(on) delete CH.auto[cid]; else CH.auto[cid]=24;
    chatExpire(); chatUI(); toast(on?'اتلغى الحذف التلقائي':'الرسائل هتتمسح بعد 24 ساعة');
  }catch(e){ toast(errTxt(e),true) }
}
async function chatBlob(path){
  if(CB.has(path)) return CB.get(path);
  await ensureToken();
  const r=await fetch(CFG.url+'/storage/v1/object/authenticated/chat-media/'+path,{headers:{apikey:CFG.key,Authorization:'Bearer '+S.access}});
  if(!r.ok) throw {code:r.status};
  const u=URL.createObjectURL(await r.blob()); CB.set(path,u); return u;
}
function hydrateChat(){
  document.querySelectorAll('#cmsgs img[data-cm]').forEach(img=>{
    if(img.dataset.ok) return;
    chatBlob(img.dataset.cm).then(u=>{img.src=u;img.dataset.ok='1'})
      .catch(()=>{const sp=document.createElement('span');sp.className='muted';sp.textContent='📎 المرفق غير متاح';img.replaceWith(sp)});
  });
}
async function uploadChat(path,blob){
  await ensureToken();
  let r; try{ r=await fetch(CFG.url+'/storage/v1/object/chat-media/'+path,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+S.access,'Content-Type':blob.type||'image/jpeg'},body:blob}) }
  catch(e){ throw {code:0,msg:'مفيش اتصال بالإنترنت'} }
  if(!r.ok&&r.status!==409){ const t=await r.text(); let m=''; try{m=JSON.parse(t).message||''}catch(e){} throw {code:r.status,msg:m||'فشل رفع الملف'} }
}
// تصغير الصورة لـ 1280px + ختم الاسم والتاريخ والوقت (نفس فكرة التطبيق)
function prepPhoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onerror=()=>{URL.revokeObjectURL(u);rej({msg:'الملف مش صورة صالحة'})};
    img.onload=()=>{
      const k=Math.min(1,1280/Math.max(img.width,img.height)), w=Math.round(img.width*k), h=Math.round(img.height*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const g=c.getContext('2d'); g.drawImage(img,0,0,w,h); URL.revokeObjectURL(u);
      const d=new Date(), lines=['رسالة من: '+ME.name, dkey(d.getTime())+'  '+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds())];
      const fs=Math.max(14,Math.round(w/38)), bh=Math.round(fs*lines.length*1.4+fs*.6);
      g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(0,h-bh,w,bh);
      g.fillStyle='#fff'; g.font='bold '+fs+'px sans-serif'; g.direction='rtl'; g.textAlign='right';
      lines.forEach((t,i)=>g.fillText(t,w-Math.round(fs*.6),h-bh+Math.round(fs*1.15)+i*Math.round(fs*1.4)));
      c.toBlob(b=>b?res(b):rej({msg:'تعذّر تجهيز الصورة'}),'image/jpeg',0.75);
    };
    img.src=u;
  });
}
async function sendChatPhoto(file){
  if(!file||!view.peer) return;
  const cid=cidOf(ME.id,view.peer), id=uuid(), path=cid+'/'+id+'.jpg';
  toast('جاري إرسال الصورة...');
  try{
    const blob=await prepPhoto(file);
    await ensureConv(cid);
    await uploadChat(path,blob);
    const rows=await api('/rest/v1/chat_messages?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=representation'},
      body:{id,conversation_id:cid,sender_id:ME.id,receiver_id:view.peer,type:'PHOTO',media_path:path}});
    if(rows&&rows[0]) addMsg(rows[0]);
    chatUI(true); toast('اتبعتت');
  }catch(e){ toast(errTxt(e),true) }
}
function chatView(){
  if(view.peer){
    return `<div class="card" style="padding:0;overflow:hidden"><div class="row chead"><button class="alt" data-act="chatBack">رجوع</button>
      <div class="av" style="width:38px;height:38px">${esc(pname(view.peer).trim().charAt(0)||'؟')}</div>
      <div class="grow"><b>${esc(pname(view.peer))}</b><div class="muted">${ROLE_AR[(PROFILES.find(p=>p.id===view.peer)||{}).role]||''}</div></div>
      <button class="alt" data-act="chatAuto" id="cauto"></button></div>
      <div id="cban"></div><div class="cmsgs" id="cmsgs"></div>
      <div class="cbar"><button class="alt att" data-act="chatPick" title="إرسال صورة">📷</button><input type="file" id="cfile" accept="image/*" hidden><textarea id="cin" rows="1" placeholder="اكتب رسالة"></textarea><button id="csend" data-act="chatSend">إرسال</button></div></div>`;
  }
  if(view.pick){
    return `<div class="row" style="margin-bottom:10px"><h2 class="grow" style="margin:0">محادثة جديدة</h2><button class="alt" data-act="chatBack">رجوع</button></div>
      <input id="cq" placeholder="ابحث بالاسم" value="${esc(CH.q)}"><div class="card" style="padding:0" id="cpeers"></div>`;
  }
  return `<div class="row" style="margin-bottom:10px"><h2 class="grow" style="margin:0">الرسائل</h2><button data-act="chatNew">+ محادثة جديدة</button></div>
    <div class="card" style="padding:0" id="clist"></div>`;
}
function chatUI(forceBottom){
  if(!ME) return;
  const un=CH.msgs.filter(m=>m.to===ME.id&&!m.read).length, b=el('cbadge');
  if(b){b.textContent=un?(un>99?'99+':un):'';b.style.display=un?'inline-block':'none'}
  if(view.tab!=='chat') return;
  if(view.peer){
    const cid=cidOf(ME.id,view.peer), on=!!CH.auto[cid], box=el('cmsgs'); if(!box) return;
    el('cauto').textContent=on?'✓ حذف بعد 24 ساعة':'حذف بعد 24 ساعة';
    el('cban').innerHTML=on?'<div class="cban">⏱ الرسائل في المحادثة دي بتتمسح تلقائيًا بعد 24 ساعة</div>':'';
    const list=CH.msgs.filter(m=>m.cid===cid).sort((a,b)=>a.at-b.at);
    const sig=cid+'|'+list.map(m=>m.id+(m.read?'r':'')).join(',');
    if(!forceBottom&&box.dataset.sig===sig){ hydrateChat(); return }
    const first=!box.dataset.ready, atBottom=first||forceBottom||box.scrollHeight-box.scrollTop-box.clientHeight<80;
    let last='',h='';
    list.forEach(m=>{
      const k=dkey(m.at); if(k!==last){h+=`<div class="dsep">${esc(dlabel(m.at))}</div>`;last=k}
      const mine=m.from===ME.id;
      const body=m.type==='TEXT'?esc(m.body).replace(/\n/g,'<br>')
        :!m.path?'📎 المرفق غير متاح'
        :m.type==='VIDEO'?`<div class="cvid" data-act="chatMedia" data-p="${esc(m.path)}" data-t="VIDEO">▶ فيديو</div>`
        :`<img class="cimg" alt="" data-cm="${esc(m.path)}" data-act="chatMedia" data-p="${esc(m.path)}" data-t="PHOTO">`;
      h+=`<div class="bub ${mine?'me':''}"><div>${body}</div><small class="${mine&&m.read?'rd':''}">${fmtT(m.at)}${mine?(m.read?' ✓✓':' ✓'):''}</small></div>`;
    });
    box.innerHTML=h||'<div class="muted" style="text-align:center;margin:auto">ابدأ المحادثة بكتابة رسالة.</div>'; box.dataset.ready='1'; box.dataset.sig=sig;
    hydrateChat();
    if(atBottom) box.scrollTop=box.scrollHeight;
  }else if(view.pick){
    const c=el('cpeers'); if(!c) return;
    const list=PROFILES.filter(p=>p.is_active&&p.id!==ME.id&&(!CH.q||normAr(p.name).includes(normAr(CH.q))));
    c.innerHTML=list.map(p=>`<div class="crow" data-act="chatOpen" data-id="${esc(p.id)}"><div class="av">${esc(p.name.trim().charAt(0)||'؟')}</div><div class="grow"><b>${esc(p.name)}</b><div class="muted">${ROLE_AR[p.role]||''}</div></div></div>`).join('')||'<p class="muted" style="padding:14px">مفيش مستخدمين متاحين.</p>';
  }else{
    const c=el('clist'); if(!c) return; const groups=new Map();
    CH.msgs.forEach(m=>{const g=groups.get(m.cid)||{peer:peerOf(m),last:m,un:0};if(m.at>=g.last.at)g.last=m;if(m.to===ME.id&&!m.read)g.un++;groups.set(m.cid,g)});
    const rows=[...groups.values()].sort((a,b)=>b.last.at-a.last.at);
    c.innerHTML=rows.map(g=>{const m=g.last,pv=(m.from===ME.id?'أنت: ':'')+(m.type==='TEXT'?m.body:m.type==='VIDEO'?'🎥 فيديو':'📷 صورة');
      return `<div class="crow" data-act="chatOpen" data-id="${esc(g.peer)}"><div class="av">${esc(pname(g.peer).trim().charAt(0)||'؟')}</div>
        <div class="grow"><b>${esc(pname(g.peer))}</b><div class="pv ${g.un?'un':''}">${esc(pv)}</div></div>
        <div style="text-align:left"><div class="muted" style="font-size:12px">${listT(m.at)}</div>${g.un?`<span class="cnt">${g.un}</span>`:''}</div></div>`}).join('')
      ||'<p class="muted" style="padding:16px">مفيش محادثات لسه. اضغط «+ محادثة جديدة» عشان تبدأ.</p>';
  }
}
setInterval(()=>{ if(!ME||!S||document.hidden) return; CH.tick++; if(view.tab==='chat'||CH.tick%10===0) chatSync() },3000);

// ---------- الأحداث ----------
const ACT={
  login:()=>doLogin(), changePw:()=>changePw(), close:()=>closeModal(), logout:()=>{closeModal();logoutLocal()},
  refresh:async()=>{try{await loadAll();render();toast('اتحدّث')}catch(e){toast(errTxt(e),true)}},
  chatOpen:d=>{view={tab:'chat',peer:d.id};render();const b=el('cmsgs');if(b)b.scrollTop=b.scrollHeight},chatNew:()=>{view={tab:'chat',pick:true};render()},chatBack:()=>{view={tab:'chat'};render()},chatSend:()=>sendChat(),chatAuto:()=>toggleAuto(),chatPick:()=>el('cfile').click(),
  chatMedia:async d=>{try{toast('جاري التحميل...');const u=await chatBlob(d.p);
    modal(d.t==='VIDEO'?`<video src="${u}" controls autoplay style="width:100%;border-radius:8px"></video><p><button class="alt" data-act="close">إغلاق</button></p>`
      :`<img class="zoom" src="${u}"><p><button class="alt" data-act="close">إغلاق</button></p>`)}catch(e){toast('المرفق غير متاح (ممكن يكون انتهت مدته)',true)}},
  tab:d=>{view={tab:d.id};render()}, fpend:d=>{FILTER.pending=d.id==='1';render()},
  openReport:d=>{view={tab:'report',id:d.id};render();window.scrollTo(0,0)},
  approve:d=>doApprove(d.a), finalApprove:()=>doFinal(),
  retForm:()=>modal(`<h3>سبب الإعادة</h3><textarea id="rnote" rows="3" placeholder="اكتب السبب (إجباري)"></textarea><div class="err" id="rerr2"></div><button data-act="doReturn">إعادة</button> <button class="alt" data-act="close">إلغاء</button>`),
  doReturn:()=>doReturn(), print:()=>window.print(), csv:()=>csvReport(), zip:()=>doZip(),
  playVid:async d=>{toast('جاري تحميل الفيديو...');try{const blob=await getMedia(view.b.r,{id:d.vid,ext:'mp4'});modal(`<video src="${URL.createObjectURL(blob)}" controls autoplay style="width:100%;border-radius:8px"></video><p><button class="alt" data-act="close">إغلاق</button></p>`)}catch(e){toast(errTxt(e),true)}},
  zoom:d=>modal(`<img class="zoom" src="${d.url}"><p><button class="alt" data-act="close">إغلاق</button></p>`),
  userForm:d=>userForm(d.id), saveUser:d=>saveUser(d.id),
  branchForm:d=>branchForm(d.id), saveBranch:d=>saveBranch(d.id), delBranch:d=>delBranch(d.id),
  openUnit:d=>{view={tab:'unit',unitId:d.id,uq:''};render()}, unitForm:d=>unitForm(d.id), saveUnit:d=>saveUnit(d.id), hideUnit:d=>hideUnit(d.id),
  groupForm:d=>groupForm(d.id), saveGroup:d=>saveGroup(d.id), hideGroup:d=>hideGroup(d.id),
  catForm:d=>catForm(d.id), saveCat:d=>saveCat(d.id), hideCat:d=>hideCat(d.id),
  ctlForm:d=>ctlForm(d.id,d.cat), saveCtl:d=>saveCtl(d.id), hideCtl:d=>hideCtl(d.id)
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b)});
document.addEventListener('change',e=>{if(e.target.id==='cfile'){const f=e.target.files&&e.target.files[0];e.target.value='';sendChatPhoto(f)}});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){FILTER.q=e.target.value;const pos=e.target.selectionStart;render();const q=el('q');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==='cq'){CH.q=e.target.value;chatUI()}
  if(e.target.id==='uq'){view.uq=e.target.value;const pos=e.target.selectionStart;render();const q=el('uq');q.focus();q.setSelectionRange(pos,pos)}
});
el('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.target.id==='cin'&&e.key==='Enter'&&!e.shiftKey&&!('ontouchstart' in window)){e.preventDefault();sendChat()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!el('modal').classList.contains('hidden'))closeModal()});
(async()=>{ if(S){try{await startSession()}catch(e){logoutLocal()}} else renderLogin() })();
