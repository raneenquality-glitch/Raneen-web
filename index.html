<script>
// ======== منطق الحساب (نفس منطق التطبيق) ========
function normAr(s){
  s = String(s||'').toLowerCase();
  const ad='٠١٢٣٤٥٦٧٨٩', pd='۰۱۲۳۴۵۶۷۸۹';
  let o='';
  for (const ch of s){
    let c=ch;
    if ('أإآٱ'.includes(c)) c='ا'; else if (c==='ة') c='ه'; else if (c==='ى') c='ي';
    else if (ad.includes(c)) c=String(ad.indexOf(c)); else if (pd.includes(c)) c=String(pd.indexOf(c));
    const k=c.charCodeAt(0);
    if ((k>=0x64B && k<=0x65F) || k===0x670 || k===0x640) continue;
    o+=c;
  }
  return o.trim();
}
function matches(q, ...fields){
  const t = normAr(q).split(/\s+/).filter(Boolean);
  if (!t.length) return true;
  const hay = normAr(fields.filter(x=>x!=null).join(' '));
  return t.every(x=>hay.includes(x));
}
const C = {branches:[],units:[],groups:[],cats:[],controls:[]};
function setCatalog(items){
  C.branches=[];C.units=[];C.groups=[];C.cats=[];C.controls=[];
  const map={branch:C.branches,unit:C.units,group:C.groups,category:C.cats,control:C.controls};
  for (const it of items){ const d=it.data; d.isActive = d.isActive!==false; if (map[it.kind]) map[it.kind].push(d); }
  const so=(a,b)=>(a.sortOrder||0)-(b.sortOrder||0);
  [C.units,C.groups,C.cats,C.controls].forEach(a=>a.sort(so));
  C.branches.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
}
function catalogItems(){
  const out=[]; const add=(kind,arr)=>arr.forEach(d=>out.push({kind,id:d.id,data:d}));
  add('branch',C.branches); add('unit',C.units); add('group',C.groups); add('category',C.cats); add('control',C.controls);
  return out;
}
const byId=(arr,id)=>arr.find(x=>x.id===id);
function unitControls(unitId, activeOnly=true){
  const ids=new Set(C.cats.filter(c=>c.unitId===unitId&&(!activeOnly||c.isActive)).map(c=>c.id));
  return C.controls.filter(k=>ids.has(k.categoryId)&&(!activeOnly||k.isActive));
}
function weightSum(unitId){ return unitControls(unitId).reduce((a,k)=>a+(k.maxScore||0),0); }
function computeUnit(unit, findings){
  const controls=unitControls(unit.id);
  const total={};
  findings.filter(f=>f.unitId===unit.id).forEach(f=>{ total[f.controlId]=(total[f.controlId]||0)+(f.violationCount||0); });
  let planned=0, loss=0;
  controls.forEach(k=>{
    planned+=k.maxScore||0;
    const v=total[k.id]||0;
    if ((k.maxScore||0)>0 && v>0) loss+=Math.min(k.maxScore, v*(k.penaltyPerViolation||1));
  });
  const actual=planned-loss;
  const ids=new Set(controls.map(k=>k.id));
  const violCount=findings.filter(f=>f.unitId===unit.id && f.violationCount>0 && ids.has(f.controlId) && (byId(C.controls,f.controlId).maxScore||0)>0).length;
  return {planned, actual, percent: planned>0? actual/planned*100 : 0, violCount};
}
const avg=a=>a.length? a.reduce((x,y)=>x+y,0)/a.length : null;
function buildReport(r, names){
  const d=r.data||{inspection:{},units:[],findings:[],photos:[]};
  const na=new Set((d.units||[]).filter(u=>u.isNA).map(u=>u.unitId));
  const lines=C.units.filter(u=>u.isActive).map(u=> na.has(u.id)? {unit:u,na:true} : Object.assign({unit:u,na:false}, computeUnit(u,d.findings||[])));
  const photosBy={}; (d.photos||[]).forEach(p=>{ (photosBy[p.findingId]=photosBy[p.findingId]||[]).push(p); });
  const unitOrder=Object.fromEntries(C.units.map((u,i)=>[u.id,i]));
  const viol=[], censusMap={};
  (d.findings||[]).filter(f=>f.violationCount>0 && !na.has(f.unitId)).forEach(f=>{
    const k=byId(C.controls,f.controlId); if(!k) return;
    const cat=byId(C.cats,k.categoryId), u=byId(C.units,f.unitId), g=f.groupId? byId(C.groups,f.groupId):null;
    if ((k.maxScore||0)<=0){
      const key=f.unitId+'|'+k.id;
      const e=censusMap[key]=censusMap[key]||{unitId:f.unitId,unitName:u?u.name:'',categoryName:cat?cat.name:'',controlText:k.text,order:[unitOrder[f.unitId]||0,cat?cat.sortOrder:0,k.sortOrder||0],parts:[]};
      e.parts.push({g:g?g.sortOrder||0:0,n:f.violationCount});
    } else viol.push({finding:f,control:k,category:cat,unit:u,group:g,photos:photosBy[f.id]||[]});
  });
  viol.sort((a,b)=>(unitOrder[a.unit&&a.unit.id]||0)-(unitOrder[b.unit&&b.unit.id]||0) || (a.category?a.category.sortOrder:0)-(b.category?b.category.sortOrder:0) || (a.control.sortOrder||0)-(b.control.sortOrder||0));
  const census=Object.values(censusMap).sort((a,b)=>a.order[0]-b.order[0]||a.order[1]-b.order[1]||a.order[2]-b.order[2]).map(e=>{ e.parts.sort((x,y)=>x.g-y.g); e.nums=e.parts.map(p=>p.n); e.total=e.nums.reduce((x,y)=>x+y,0); e.expr=e.nums.length>1? '('+e.nums.join('+')+') = '+e.total : String(e.total); return e; });
  const missing=viol.filter(v=>v.control.photoRequired && !v.photos.length).length;
  return {
    r, d, lines, viol, census, missing,
    branch:(byId(C.branches,r.branch_id)||{}).name||'فرع محذوف',
    inspector:(names&&names[r.inspector_id])||'',
    secAvg: avg(lines.filter(l=>!l.na&&l.unit.kind==='SECTION').map(l=>l.percent)),
    admAvg: avg(lines.filter(l=>!l.na&&l.unit.kind==='ADMINISTRATION').map(l=>l.percent))
  };
}
if (typeof module!=='undefined') module.exports={normAr,matches,C,setCatalog,catalogItems,computeUnit,buildReport,weightSum,unitControls};
// ======== ZIP (بدون ضغط) ========
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(); const parts=[]; const cds=[]; let off=0, cdSize=0;
  for(const f of files){
    const name=enc.encode(f.name), crc=crc32(f.data), size=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,size,true);h.setUint32(22,size,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,name,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,size,true);c.setUint32(24,size,true);c.setUint16(28,name.length,true);
    c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);
    cds.push(c.buffer,name); cdSize+=46+name.length; off+=30+name.length+size;
  }
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cds,end.buffer],{type:'application/zip'});
}
if (typeof module!=='undefined') module.exports.makeZip=makeZip;

</script>
<script>
// ======== الواجهة ========
const CFG={url:"https://rdhmulfhwgdjtadpcsge.supabase.co",key:"sb_publishable_7zeqh0Qa5ppXCgqlohLVdA_JwtEEHoT",fn:"smart-processor",bucket:"report-photos",domain:"raneen.app"};
const ROLE_AR={INSPECTOR:"مراقب جودة",AREA_MANAGER:"مدير منطقة",DEPT_MANAGER:"مدير إدارة",ADMIN:"مدير النظام"};
const ST={SUBMITTED:"مُرسل — بانتظار مدير المنطقة",REVIEWED:"تمت المراجعة — بانتظار مدير الإدارة",RETURNED:"أُعيد للمراقب",FINAL_APPROVED:"معتمد نهائيًا"};
const ST_SHORT={SUBMITTED:"مُرسل",REVIEWED:"تمت المراجعة",RETURNED:"مُعاد",FINAL_APPROVED:"معتمد"};
const ACT_AR={SUBMITTED:"إرسال التقرير",RESUBMITTED:"إعادة إرسال بعد التعديل",REVIEWED:"مراجعة واعتماد (مدير المنطقة)",RETURNED:"إعادة للتعديل",FINAL_APPROVED:"اعتماد نهائي"};
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const fmtD=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const pctTxt=v=>v==null?'—':f1(v)+'%';
const sc=p=>p==null?'':p>=90?'ok':p>=75?'mid':'bad';
const uid=()=>crypto.randomUUID?crypto.randomUUID():('id'+Date.now()+Math.random().toString(16).slice(2));

let S=JSON.parse(localStorage.getItem('rq_sess')||'null'), ME=null, REPORTS=[], PROFILES=[], NAMES={};
let view={tab:'reports'}, FILTER={pending:true,q:''}; const MEDIA=new Map();

function toast(m,err){const t=el('toast');t.textContent=m;t.style.background=err?'#b00020':'#222';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',err?6000:3000)}
function modal(html){const m=el('modal');m.innerHTML=`<div class="box">${html}</div>`;m.classList.remove('hidden')}
function closeModal(){el('modal').classList.add('hidden');el('modal').innerHTML=''}

// ---------- API ----------
async function ensureToken(){
  if(!S) throw {code:401,msg:'سجّل دخول'};
  if(Date.now()<S.exp-60000) return;
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.refresh})});
  if(!r.ok){logoutLocal();throw {code:401,msg:'انتهت الجلسة'}}
  const j=await r.json(); saveS(j);
}
function saveS(j){S={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+j.expires_in*1000,uid:j.user.id};localStorage.setItem('rq_sess',JSON.stringify(S))}
async function api(path,o={}){
  if(!o.noAuth) await ensureToken();
  const h=Object.assign({apikey:CFG.key},o.headers||{});
  if(!o.noAuth) h.Authorization='Bearer '+S.access;
  let body=o.body; if(body!==undefined){h['Content-Type']='application/json';body=JSON.stringify(body)}
  let r; try{ r=await fetch(CFG.url+path,{method:o.method||'GET',headers:h,body}) }catch(e){ throw {code:0,msg:'مفيش اتصال بالإنترنت'} }
  if(!r.ok){const t=await r.text();let m='';try{const j=JSON.parse(t);m=j.message||j.error||j.msg||j.error_description||''}catch(e){m=t} throw {code:r.status,msg:m}}
  if(o.raw) return r;
  const t=await r.text(); return t?JSON.parse(t):null;
}
const errTxt=e=>{const m=(e&&e.msg)||'';
  if(/not found/i.test(m))return 'التقرير مش موجود على السيرفر';
  if(/not allowed/i.test(m))return 'غير مسموح بالعملية دي في الحالة الحالية ('+m.replace(/^.*\(/,'(')+'';
  if(/Invalid login/i.test(m)||e.code===400&&!m)return 'اسم المستخدم أو كلمة المرور غلط';
  return m||'حصل خطأ ('+(e&&e.code)+')'};

// ---------- الدخول ----------
async function doLogin(){
  const u=el('lu').value.trim().toLowerCase(), p=el('lp').value;
  el('lerr').textContent='';
  if(!u||!p){el('lerr').textContent='اكتب اسم المستخدم وكلمة المرور';return}
  try{
    const j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email:u+'@'+CFG.domain,password:p},noAuth:true});
    saveS(j); await startSession();
  }catch(e){el('lerr').textContent=errTxt(e)}
}
function logoutLocal(){S=null;ME=null;localStorage.removeItem('rq_sess');renderLogin()}
async function startSession(){
  const pr=await api(`/rest/v1/profiles?id=eq.${S.uid}&select=*`);
  if(!pr.length||!pr[0].is_active){logoutLocal();el('lerr').textContent='الحساب غير مفعّل';return}
  ME=pr[0];
  if(ME.role==='INSPECTOR'){logoutLocal();el('lerr').textContent='النسخة دي للمديرين والأدمن. المراقب يستخدم تطبيق الموبايل.';return}
  if(ME.must_change){renderMustChange();return}
  await loadAll(); view={tab:'reports'}; render();
}
function renderLogin(){
  el('app').innerHTML=`<div class="login card"><h2 style="color:var(--red);margin-top:0">رنين — إدارة الجودة</h2>
  <label>اسم المستخدم</label><input id="lu" autocomplete="username" autocapitalize="off">
  <label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password">
  <div class="err" id="lerr"></div><button data-act="login" style="width:100%">دخول</button></div>`;
  el('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
}
function renderMustChange(){
  el('app').innerHTML=`<div class="login card"><h3>غيّر كلمة المرور</h3><p class="muted">لازم تغيّر كلمة المرور قبل ما تكمّل.</p>
  <label>كلمة المرور الجديدة (8 أحرف على الأقل)</label><input id="np1" type="password"><label>تأكيد كلمة المرور</label><input id="np2" type="password">
  <div class="err" id="lerr"></div><button data-act="changePw" style="width:100%">حفظ</button></div>`;
}
async function changePw(){
  const a=el('np1').value,b=el('np2').value;
  if(a.length<8){el('lerr').textContent='8 أحرف على الأقل';return} if(a!==b){el('lerr').textContent='كلمتين المرور مش متطابقتين';return}
  try{await api('/auth/v1/user',{method:'PUT',body:{password:a}});await api('/rest/v1/rpc/password_changed',{method:'POST',body:{}});ME.must_change=false;await loadAll();view={tab:'reports'};render()}
  catch(e){el('lerr').textContent=errTxt(e)}
}
async function loadAll(){
  const [cat,prof,reps]=await Promise.all([
    api('/rest/v1/catalog_items?select=kind,id,data&order=kind,id'),
    api('/rest/v1/profiles?select=*'),
    api('/rest/v1/reports?select=*&order=updated_at.desc&limit=300')]);
  setCatalog(cat); PROFILES=prof; NAMES=Object.fromEntries(prof.map(p=>[p.id,p.name])); REPORTS=reps;
}

// ---------- الإطار ----------
function render(){
  const admin=ME.role==='ADMIN';
  const tabs=[['reports','التقارير']].concat(admin?[['users','المستخدمون'],['branches','الفروع'],['catalog','الأقسام والضوابط']]:[]);
  const on=view.tab==='unit'?'catalog':view.tab==='report'?'reports':view.tab;
  el('app').innerHTML=`<header class="top"><h1>رنين — إدارة الجودة</h1><small>${esc(ME.name)} · ${ROLE_AR[ME.role]||''}</small>
    <button class="alt" data-act="refresh">تحديث</button><button class="alt" data-act="logout">خروج</button></header>
    <nav class="tabs">${tabs.map(t=>`<button class="${on===t[0]?'on':''}" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</nav>
    <main>${view.tab==='reports'?reportsView():view.tab==='report'?reportView():view.tab==='users'?usersView():view.tab==='branches'?branchesView():view.tab==='catalog'?catalogView():unitView()}</main>`;
  if(view.tab==='report') afterReport();
}
const needs=r=>(ME.role==='AREA_MANAGER'&&r.status==='SUBMITTED')||(ME.role==='DEPT_MANAGER'&&r.status==='REVIEWED');

// ---------- التقارير ----------
function reportsView(){
  const mgr=ME.role==='AREA_MANAGER'||ME.role==='DEPT_MANAGER';
  let list=REPORTS.slice();
  if(mgr&&FILTER.pending) list=list.filter(needs);
  if(FILTER.q) list=list.filter(r=>matches(FILTER.q,r.report_number,(byId(C.branches,r.branch_id)||{}).name,NAMES[r.inspector_id]));

function afterReport(){ const r=REPORTS.find(x=>x.id===view.id); if(r&&r.status!=='FINAL_APPROVED') hydrateMedia(r); }
async function getMedia(r,p){
  if(MEDIA.has(p.id)) return MEDIA.get(p.id);
  const res=await api(`/storage/v1/object/authenticated/${CFG.bucket}/${r.inspector_id}/${r.id}/${p.id}.${p.ext||'jpg'}`,{raw:true});
  const blob=await res.blob(); MEDIA.set(p.id,blob); return blob;
}
async function hydrateMedia(r){
  const nodes=[...document.querySelectorAll('[data-media]')]; let i=0;
  const worker=async()=>{while(i<nodes.length){const n=nodes[i++];try{const blob=await getMedia(r,{id:n.dataset.media,ext:n.dataset.ext});const url=URL.createObjectURL(blob);
    n.innerHTML=n.dataset.ext==='mp4'?`<video src="${url}" controls preload="metadata"></video>`:`<img src="${url}" data-act="zoom" data-url="${url}">`}catch(e){n.textContent='غير متاحة'}}};
  await Promise.all([worker(),worker(),worker(),worker()]);
}
async function review(action,note){
  const r=REPORTS.find(x=>x.id===view.id);
  await api('/rest/v1/rpc/review_report',{method:'POST',body:{p_id:r.id,p_action:action,p_note:note||null}});
  REPORTS=await api('/rest/v1/reports?select=*&order=updated_at.desc&limit=300');
}
async function doApprove(a){ try{ await review(a); toast('تم'); render() }catch(e){ el('rerr').textContent=errTxt(e) } }
async function doReturn(){
  const n=el('rnote').value.trim(); if(!n){el('rerr2').textContent='اكتب السبب';return}
  try{await review('RETURNED',n);closeModal();toast('اترجّع للمراقب');render()}catch(e){el('rerr2').textContent=errTxt(e)}
}
function mediaName(b,v,k,p,used){
  const cl=t=>String(t||'').replace(/[\\/:*?"<>|]/g,'_').trim();
  const base=`${cl(v.unit&&v.unit.name)}/${v.control.sortOrder}`+(v.group?'_'+cl(v.group.name):'')+`_${k+1}`;
  const ext=p.ext||'jpg'; let name=`${base}.${ext}`,n=2; while(used.has(name)){name=`${base}_${n}.${ext}`;n++} used.add(name); return name;
}
async function collectZip(b){
  const files=[],used=new Set();
  for(const v of b.viol){let k=0;for(const p of v.photos){let blob;try{blob=await getMedia(b.r,p)}catch(e){if(e.code===404||e.code===400)continue;throw e}
    files.push({name:mediaName(b,v,k++,p,used),data:new Uint8Array(await blob.arrayBuffer())})}}
  return files;
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
async function doZip(){
  const b=view.b; toast('جاري تجهيز الملف...');
  try{const f=await collectZip(b); if(!f.length){toast('مفيش صور متاحة',true);return} download(makeZip(f),`Raneen_${b.r.report_number}_photos.zip`)}catch(e){toast(errTxt(e),true)}
}
async function doFinal(){
  const b=view.b,r=b.r; const btn=document.querySelector('[data-act=finalApprove]'); if(btn)btn.disabled=true;
  try{
    toast('جاري تنزيل الصور أولًا...');
    const files=await collectZip(b);                         // لازم كل الصور تتنزّل قبل الاعتماد
    if(files.length) download(makeZip(files),`Raneen_${r.report_number}_photos.zip`);
    await review('FINAL_APPROVED');
    for(const v of b.viol) for(const p of v.photos){ try{await api(`/storage/v1/object/${CFG.bucket}/${r.inspector_id}/${r.id}/${p.id}.${p.ext||'jpg'}`,{method:'DELETE'})}catch(e){} }
    toast('اتعتمد التقرير. احفظ ملف ZIP + اطبع PDF للأرشيف.'); render();
  }catch(e){ el('rerr').textContent=errTxt(e); if(btn)btn.disabled=false }
}
function csvReport(){
  const b=view.b,q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"',rows=[];
  rows.push(['رقم التقرير',b.r.report_number],['الفرع',b.branch],['المراقب',b.inspector],['الحالة',ST[b.r.status]],['متوسط الأقسام',pctTxt(b.secAvg)],['متوسط الإدارات',pctTxt(b.admAvg)],[],['القسم','الدرجة','من','النسبة','المخالفات']);
  b.lines.forEach(l=>rows.push(l.na?[l.unit.name,'N/A']:[l.unit.name,f1(l.actual),f1(l.planned),f1(l.percent),l.violCount]));
  rows.push([],['القسم','الكاتجري','رقم البند','البند','المجموعة','عدد الصور']);
  b.viol.forEach(v=>rows.push([v.unit&&v.unit.name,v.category&&v.category.name,v.control.sortOrder,v.control.text,v.group?v.group.name:'',v.photos.length]));
  if(b.census.length){rows.push([],['ضوابط الحصر'],['القسم','الكاتجري','الضابط','التفاصيل','المجموع']);b.census.forEach(c=>rows.push([c.unitName,c.categoryName,c.controlText,c.nums.join('+'),c.total]))}
  download(new Blob(['\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`Raneen_${b.r.report_number}.csv`);
}

   <button data-act="save${kind}" data-id="${esc(id||'')}">حفظ</button> <button class="alt" data-act="close">إلغاء</button> ${canDel?`<button class="danger" data-act="hide${kind}" data-id="${esc(id)}">حذف</button>`:''}`);
}
const groupForm=id=>nameForm('Group',id,id?'تعديل مجموعة':'إضافة مجموعة','اسم المجموعة',id?byId(C.groups,id).name:'',!!id);
const catForm=id=>nameForm('Cat',id,id?'تعديل كاتجري':'إضافة كاتجري','اسم الكاتجري',id?byId(C.cats,id).name:'',!!id);
async function saveGroup(id){const name=el('f_name').value.trim();if(!name){el('ferr').textContent='اكتب الاسم';return}
  if(id) byId(C.groups,id).name=name; else C.groups.push({id:uid(),unitId:view.unitId,name,sortOrder:maxSort(C.groups.filter(g=>g.unitId===view.unitId))+1,isActive:true});
  if(await commit()){closeModal();render()}}
async function hideGroup(id){byId(C.groups,id).isActive=false;if(await commit()){closeModal();render()}}
async function saveCat(id){const name=el('f_name').value.trim();if(!name){el('ferr').textContent='اكتب الاسم';return}
  if(id) byId(C.cats,id).name=name; else C.cats.push({id:uid(),unitId:view.unitId,name,sortOrder:maxSort(C.cats.filter(c=>c.unitId===view.unitId))+1,isActive:true});
  if(await commit()){closeModal();render()}}
async function hideCat(id){byId(C.cats,id).isActive=false;C.controls.filter(k=>k.categoryId===id).forEach(k=>k.isActive=false);if(await commit()){closeModal();render()}}
function ctlForm(id,catId){
  const unit=view.unitId, cats=C.cats.filter(c=>c.unitId===unit&&c.isActive), hasG=C.groups.some(g=>g.unitId===unit&&g.isActive);
  const k=id?byId(C.controls,id):{categoryId:catId,text:'',hint:'',maxScore:'',penaltyPerViolation:1,photoRequired:true,perGroup:false};
  const census=id&&(k.maxScore||0)<=0;
  modal(`<h3>${id?'تعديل ضابط':'إضافة ضابط'}</h3><label>الكاتجري</label><select id="f_cat">${cats.map(c=>`<option value="${esc(c.id)}" ${k.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
   <label>نص الضابط</label><textarea id="f_text" rows="2">${esc(k.text)}</textarea><label>ملاحظة للمراقب (اختياري)</label><input id="f_hint" value="${esc(k.hint||'')}">
   ${hasG?`<label class="chk"><input type="checkbox" id="f_census" ${census?'checked':''}> ضابط حصر (عدد من غير درجة)</label>`:''}
   <label>الوزن (الدرجة الكاملة)</label><input id="f_w" inputmode="decimal" value="${census?'':esc(k.maxScore)}"><label>الخصم لكل مخالفة (1 عادي، 2 مضاعف)</label><input id="f_p" inputmode="decimal" value="${esc(k.penaltyPerViolation)}">
   <label class="chk"><input type="checkbox" id="f_photo" ${k.photoRequired?'checked':''}> يتطلب صورة عند المخالفة</label>${hasG?`<label class="chk"><input type="checkbox" id="f_pg" ${k.perGroup?'checked':''}> بيتسجل على كل مجموعة لوحدها</label>`:''}
   <div class="err" id="ferr"></div><button data-act="saveCtl" data-id="${esc(id||'')}">حفظ</button> <button class="alt" data-act="close">إلغاء</button> ${id?`<button class="danger" data-act="hideCtl" data-id="${esc(id)}">حذف</button>`:''}`);
}
async function saveCtl(id){
  const num=s=>parseFloat(normAr(s).replace(',','.').replace('٫','.'));
  const cat=el('f_cat').value,text=el('f_text').value.trim(),hint=el('f_hint').value.trim()||null,census=el('f_census')&&el('f_census').checked;
  const w=census?0:num(el('f_w').value),pen=census?1:num(el('f_p').value);
  if(!text){el('ferr').textContent='اكتب نص الضابط';return}
  if(!census&&!(w>0)){el('ferr').textContent='الوزن لازم يكون رقم أكبر من صفر';return}
  if(!census&&!(pen>0)){el('ferr').textContent='الخصم لازم يكون رقم أكبر من صفر';return}
  const f={categoryId:cat,text,hint,maxScore:w,penaltyPerViolation:pen,photoRequired:census?false:el('f_photo').checked,perGroup:census?true:!!(el('f_pg')&&el('f_pg').checked)};
  if(id) Object.assign(byId(C.controls,id),f); else C.controls.push(Object.assign({id:uid(),sortOrder:maxSort(unitControls(view.unitId,false))+1,isActive:true},f));
  if(await commit()){closeModal();render()}
}
async function hideCtl(id){byId(C.controls,id).isActive=false;if(await commit()){closeModal();render()}}

// ---------- الأحداث ----------
const ACT={
  login:()=>doLogin(), changePw:()=>changePw(), close:()=>closeModal(), logout:()=>{closeModal();logoutLocal()},
  refresh:async()=>{try{await loadAll();render();toast('اتحدّث')}catch(e){toast(errTxt(e),true)}},
  tab:d=>{view={tab:d.id};render()}, fpend:d=>{FILTER.pending=d.id==='1';render()},
  openReport:d=>{view={tab:'report',id:d.id};render();window.scrollTo(0,0)},
  approve:d=>doApprove(d.a), finalApprove:()=>doFinal(),
  retForm:()=>modal(`<h3>سبب الإعادة</h3><textarea id="rnote" rows="3" placeholder="اكتب السبب (إجباري)"></textarea><div class="err" id="rerr2"></div><button data-act="doReturn">إعادة</button> <button class="alt" data-act="close">إلغاء</button>`),
  doReturn:()=>doReturn(), print:()=>window.print(), csv:()=>csvReport(), zip:()=>doZip(),
  zoom:d=>modal(`<img class="zoom" src="${d.url}"><p><button class="alt" data-act="close">إغلاق</button></p>`),
  userForm:d=>userForm(d.id), saveUser:d=>saveUser(d.id),
  branchForm:d=>branchForm(d.id), saveBranch:d=>saveBranch(d.id), delBranch:d=>delBranch(d.id),
  openUnit:d=>{view={tab:'unit',unitId:d.id,uq:''};render()}, unitForm:d=>unitForm(d.id), saveUnit:d=>saveUnit(d.id), hideUnit:d=>hideUnit(d.id),
  groupForm:d=>groupForm(d.id), saveGroup:d=>saveGroup(d.id), hideGroup:d=>hideGroup(d.id),
  catForm:d=>catForm(d.id), saveCat:d=>saveCat(d.id), hideCat:d=>hideCat(d.id),
  ctlForm:d=>ctlForm(d.id,d.cat), saveCtl:d=>saveCtl(d.id), hideCtl:d=>hideCtl(d.id)
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b)});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){FILTER.q=e.target.value;const pos=e.target.selectionStart;render();const q=el('q');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==='uq'){view.uq=e.target.value;const pos=e.target.selectionStart;render();const q=el('uq');q.focus();q.setSelectionRange(pos,pos)}
});
el('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
(async()=>{ if(S){try{await startSession()}catch(e){logoutLocal()}} else renderLogin() })();

</script>
</body>
</html>
